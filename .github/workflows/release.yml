name: Build Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Visual Studio
      uses: ilammy/msvc-dev-cmd@v1

    - name: Build
      run: |
        build.bat
      shell: cmd

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          build\**\*.exe
